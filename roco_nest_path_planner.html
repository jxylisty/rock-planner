<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家园小窝路径规划</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.96);
      --ink: #20343f;
      --muted: #667983;
      --line: rgba(32, 52, 63, 0.12);
      --male: #6fb3c6;
      --female: #ee9384;
      --pair: rgba(234, 155, 82, 0.45);
      --shadow: 0 18px 48px rgba(79, 61, 31, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 207, 160, 0.42), transparent 30%),
        radial-gradient(circle at top right, rgba(113, 181, 198, 0.28), transparent 30%),
        linear-gradient(180deg, #fbf7ef 0%, #f1e8d5 100%);
    }
    .shell { max-width: 1480px; margin: 0 auto; padding: 28px 20px 40px; }
    .hero { display: grid; gap: 10px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.06; }
    .hero p { margin: 0; max-width: 940px; line-height: 1.7; color: var(--muted); font-size: 15px; }
    .hero-links { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-links a {
      display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 999px;
      text-decoration: none; color: var(--ink); background: rgba(255, 250, 240, 0.92);
      border: 1px solid var(--line); font-size: 14px; font-weight: 700;
    }
    .layout { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid rgba(255,255,255,.72); border-radius: 24px; box-shadow: var(--shadow); }
    .controls { padding: 22px; position: sticky; top: 16px; display: grid; gap: 16px; }
    .results { padding: 22px; display: grid; gap: 18px; }
    .section-title { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    .triple { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .field { display: grid; gap: 8px; }
    .field label { font-size: 14px; font-weight: 700; }
    input, select, button {
      width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
      background: #fffaf1; color: var(--ink); font: inherit;
    }
    .button-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    button { cursor: pointer; border: none; font-weight: 700; }
    button.primary { background: linear-gradient(135deg, #df7559 0%, #ca4f64 100%); color: #fff; }
    button.secondary { background: rgba(255,250,240,.92); color: var(--ink); border: 1px solid var(--line); }
    .hint, .board-wrap, .table-wrap, .pair-wrap {
      padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.75); border: 1px solid var(--line);
    }
    .hint { color: var(--muted); line-height: 1.65; font-size: 13px; }
    .status { font-weight: 700; font-size: 14px; }
    .status.good { color: #2f8755; }
    .status.error { color: #b42318; }
    .overview, .stat {
      padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.78); border: 1px solid rgba(32,52,63,.08);
    }
    .overview-grid, .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .overview strong, .stat strong { font-size: 22px; line-height: 1; }
    .overview span, .stat span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .solution-select { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 12px; align-items: center; }
    .solution-note { font-size: 13px; color: var(--muted); line-height: 1.6; }
    svg { width: 100%; height: auto; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid rgba(32,52,63,.08); text-align: left; vertical-align: top; }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.male { background: rgba(111,181,198,.18); color: #2b6d7d; }
    .badge.female { background: rgba(238,147,132,.18); color: #a55145; }
    .pair-list { display: grid; gap: 10px; }
    .pair-chip { padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.78); border: 1px solid rgba(32,52,63,.08); line-height: 1.6; font-size: 14px; }
    @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } .controls { position: static; } }
    @media (max-width: 680px) { .triple, .button-row, .solution-select { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>家园小窝路径规划</h1>
      <p>这个页面只研究纯几何问题：每个小窝是 2×2 矩形，用左上角整数坐标表示。目标是在给定公母数量下，让异性之间的有效路径数量尽量多。</p>
      <div class="hero-links">
        <a href="./roco_nest_optimizer.html">返回理论繁育页</a>
        <a href="./roco_shiny_breeding_planner.html">返回库存补图鉴页</a>
      </div>
    </section>

    <div class="layout">
      <aside class="panel controls">
        <h2 class="section-title">输入</h2>
        <div class="grid">
          <div class="triple">
            <div class="field">
              <label for="maleCount">雄性数量</label>
              <input id="maleCount" type="number" min="0" max="20" value="5">
            </div>
            <div class="field">
              <label for="femaleCount">雌性数量</label>
              <input id="femaleCount" type="number" min="0" max="20" value="5">
            </div>
            <div class="field">
              <label for="nestCount">小窝总数</label>
              <input id="nestCount" type="number" min="1" max="20" value="10">
            </div>
          </div>

          <div class="field">
            <label for="autoField">自动补全</label>
            <select id="autoField">
              <option value="nest">自动计算小窝总数</option>
              <option value="female">自动计算雌性数量</option>
              <option value="male">自动计算雄性数量</option>
            </select>
          </div>

          <div class="field">
            <label for="solutionSelect">候选方案</label>
            <select id="solutionSelect"></select>
          </div>

          <div class="button-row">
            <button id="solveButton" class="primary" type="button">计算摆法</button>
            <button id="presetButton" class="secondary" type="button">填入 5 公 5 母 10 窝</button>
          </div>
        </div>

        <div class="hint">
          规则：
          <br>1. 每个小窝占 2×2。
          <br>2. 两个小窝如果 `abs(dx) < 2 && abs(dy) < 2`，则重叠，非法。
          <br>3. 两个小窝如果 `abs(dx) + abs(dy) <= 5`，则存在一条有效路径。
          <br>4. 固定布局后，公母划分用 bitmask 精确穷举。
        </div>
      </aside>

      <main class="panel results">
        <div id="status" class="status good">准备就绪。</div>

        <section class="grid">
          <h2 class="section-title">结果摘要</h2>
          <div id="overviewGrid" class="overview-grid"></div>
          <div id="solutionNote" class="solution-note"></div>
        </section>

        <section class="grid">
          <h2 class="section-title">关键数值</h2>
          <div id="stats" class="stats-grid"></div>
        </section>

        <section class="grid">
          <h2 class="section-title">推荐摆放图</h2>
          <div class="board-wrap">
            <svg id="board" viewBox="0 0 800 520" aria-label="小窝摆放图"></svg>
          </div>
        </section>

        <section class="grid">
          <h2 class="section-title">窝位明细</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>性别</th>
                  <th>左上角坐标</th>
                  <th>可连路径数</th>
                </tr>
              </thead>
              <tbody id="nestTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="grid">
          <h2 class="section-title">路径列表</h2>
          <div class="pair-wrap">
            <div id="pairList" class="pair-list"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "roco_nest_path_planner_state_v4";
    const maleInput = document.getElementById("maleCount");
    const femaleInput = document.getElementById("femaleCount");
    const nestInput = document.getElementById("nestCount");
    const autoFieldInput = document.getElementById("autoField");
    const solveButton = document.getElementById("solveButton");
    const presetButton = document.getElementById("presetButton");
    const statusEl = document.getElementById("status");
    const overviewGrid = document.getElementById("overviewGrid");
    const solutionSelectEl = document.getElementById("solutionSelect");
    const solutionNoteEl = document.getElementById("solutionNote");
    const statsEl = document.getElementById("stats");
    const boardEl = document.getElementById("board");
    const nestTableBody = document.getElementById("nestTableBody");
    const pairList = document.getElementById("pairList");

    let currentPlans = [];

    function normalizeCells(cells) {
      const minX = Math.min(...cells.map(cell => cell.x));
      const minY = Math.min(...cells.map(cell => cell.y));
      return cells.map(cell => ({ x: cell.x - minX, y: cell.y - minY })).sort((a, b) => a.y - b.y || a.x - b.x);
    }

    function serializeCells(cells) {
      return cells.map(cell => `${cell.x},${cell.y}`).join(";");
    }

    function canonical(cells) {
      const transforms = [
        ({ x, y }) => ({ x, y }),
        ({ x, y }) => ({ x: -x, y }),
        ({ x, y }) => ({ x, y: -y }),
        ({ x, y }) => ({ x: -x, y: -y }),
        ({ x, y }) => ({ x: y, y: x }),
        ({ x, y }) => ({ x: -y, y: x }),
        ({ x, y }) => ({ x: y, y: -x }),
        ({ x, y }) => ({ x: -y, y: -x })
      ];
      const keys = transforms.map(transform => serializeCells(normalizeCells(cells.map(transform))));
      keys.sort();
      return keys[0];
    }

    function cellsOverlap(a, b) {
      return Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2;
    }

    function isLegalLayout(cells) {
      for (let i = 0; i < cells.length; i++) {
        for (let j = i + 1; j < cells.length; j++) {
          if (cellsOverlap(cells[i], cells[j])) return false;
        }
      }
      return true;
    }

    function pairDistance(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function hasEdge(a, b) {
      return pairDistance(a, b) <= 5;
    }

    function canAdd(point, points) {
      return !points.some(existing => cellsOverlap(existing, point)) &&
        points.some(existing => hasEdge(existing, point));
    }

    function potentialDegree(point, points) {
      return points.reduce((count, existing) => count + (hasEdge(existing, point) ? 1 : 0), 0);
    }

    function scoreShape(cells) {
      let pairScore = 0;
      for (let i = 0; i < cells.length; i++) {
        for (let j = i + 1; j < cells.length; j++) {
          if (hasEdge(cells[i], cells[j])) {
            pairScore++;
          }
        }
      }
      const width = Math.max(...cells.map(cell => cell.x)) + 2;
      const height = Math.max(...cells.map(cell => cell.y)) + 2;
      return { pairScore, compactness: -(width * height), width, height };
    }

    function scorePartialLayout(cells) {
      const shape = scoreShape(cells);
      const { adjacency } = buildEdges(cells);
      const degrees = adjacency.map(list => list.length).sort((a, b) => b - a);
      const degreeHead = degrees.slice(0, Math.min(4, degrees.length)).reduce((sum, value) => sum + value, 0);
      return {
        pairScore: shape.pairScore,
        degreeHead,
        compactness: shape.compactness,
        height: shape.height,
        width: shape.width
      };
    }

    function buildStructuredLayout(n, rowWidth, stagger = 0, vertical = false) {
      const width = Math.max(1, Math.min(n, rowWidth));
      const cells = [];
      for (let index = 0; index < n; index++) {
        const row = Math.floor(index / width);
        const col = index % width;
        if (vertical) {
          const offset = stagger && (col % 2 === 1) ? stagger : 0;
          cells.push({ x: row * 2 + offset, y: col * 2 });
        } else {
          const offset = stagger && (row % 2 === 1) ? stagger : 0;
          cells.push({ x: col * 2 + offset, y: row * 2 });
        }
      }
      return normalizeCells(cells);
    }

    function generateStructuredLayouts(n) {
      if (n <= 0) return [[]];
      const widths = [...new Set([
        Math.ceil(Math.sqrt(n)),
        Math.max(2, Math.floor(Math.sqrt(n))),
        Math.max(2, Math.ceil(n / 2)),
        Math.max(3, Math.ceil(n / 3))
      ])];
      const layouts = new Map();
      for (const width of widths) {
        for (const stagger of [0, 1]) {
          const a = buildStructuredLayout(n, width, stagger, false);
          const b = buildStructuredLayout(n, width, stagger, true);
          if (isLegalLayout(a)) layouts.set(canonical(a), a);
          if (isLegalLayout(b)) layouts.set(canonical(b), b);
        }
      }
      return [...layouts.values()];
    }

    function generateCandidatePositions(cells) {
      const next = new Map();
      for (const cell of cells) {
        for (let dx = -5; dx <= 5; dx++) {
          for (let dy = -5; dy <= 5; dy++) {
            if (dx === 0 && dy === 0) continue;
            const candidate = { x: cell.x + dx, y: cell.y + dy };
            if (!canAdd(candidate, cells)) continue;
            next.set(`${candidate.x},${candidate.y}`, candidate);
          }
        }
      }
      return [...next.values()].sort((a, b) => (
        potentialDegree(b, cells) - potentialDegree(a, cells) ||
        a.y - b.y || a.x - b.x
      ));
    }

    function buildEdges(cells) {
      const edges = [];
      const adjacency = Array.from({ length: cells.length }, () => []);
      for (let i = 0; i < cells.length; i++) {
        for (let j = i + 1; j < cells.length; j++) {
          if (hasEdge(cells[i], cells[j])) {
            edges.push([i, j]);
            adjacency[i].push(j);
            adjacency[j].push(i);
          }
        }
      }
      return { edges, adjacency };
    }

    function estimateCombinationCount(n, k) {
      const choose = Math.min(k, n - k);
      let result = 1;
      for (let i = 1; i <= choose; i++) {
        result = (result * (n - choose + i)) / i;
        if (result > 400000) return result;
      }
      return result;
    }

    function evaluateLayout(points, maleCount) {
      const { edges, adjacency } = buildEdges(points);
      const n = points.length;
      let bestMask = 0;
      let bestScore = -1;

      if (estimateCombinationCount(n, maleCount) <= 300000) {
        function dfs(start, chosen, mask) {
          if (chosen === maleCount) {
            let score = 0;
            for (const [a, b] of edges) {
              if ((((mask >>> a) & 1) === 1) !== (((mask >>> b) & 1) === 1)) score++;
            }
            if (score > bestScore) {
              bestScore = score;
              bestMask = mask;
            }
            return;
          }
          for (let index = start; index <= n - (maleCount - chosen); index++) {
            dfs(index + 1, chosen + 1, mask | (1 << index));
          }
        }
        dfs(0, 0, 0);
      } else {
        const order = [...Array(n).keys()].sort((a, b) => adjacency[b].length - adjacency[a].length || a - b);
        let maleSet = new Set(order.slice(0, maleCount));
        function cutScore(set) {
          let score = 0;
          for (const [a, b] of edges) {
            if (set.has(a) !== set.has(b)) score++;
          }
          return score;
        }
        let improved = true;
        while (improved) {
          improved = false;
          let bestSwap = null;
          let localBest = cutScore(maleSet);
          const males = [...maleSet];
          const females = [...Array(n).keys()].filter(index => !maleSet.has(index));
          for (const male of males) {
            for (const female of females) {
              const next = new Set(maleSet);
              next.delete(male);
              next.add(female);
              const score = cutScore(next);
              if (score > localBest) {
                localBest = score;
                bestSwap = { male, female };
              }
            }
          }
          if (bestSwap) {
            maleSet.delete(bestSwap.male);
            maleSet.add(bestSwap.female);
            improved = true;
          }
        }
        bestScore = cutScore(maleSet);
        for (const index of maleSet) bestMask |= 1 << index;
      }

      return { maleMask: bestMask, crossEdgeUpperBound: bestScore, edges, adjacency };
    }

    function scoreLayoutSkeleton(cells, maleCount) {
      const { edges, adjacency } = buildEdges(cells);
      const sexPlan = evaluateLayout(cells, maleCount);
      const degrees = adjacency.map(list => list.length).sort((a, b) => b - a);
      const shape = scoreShape(cells);
      return {
        crossEdges: sexPlan.crossEdgeUpperBound,
        totalEdges: edges.length,
        degreeSum: degrees.reduce((sum, value) => sum + value, 0),
        compactness: shape.compactness,
        height: shape.height
      };
    }

    function generateLayoutNeighbors(cells) {
      const next = new Map();
      for (let index = 0; index < cells.length; index++) {
        const cell = cells[index];
        for (let dx = -2; dx <= 2; dx++) {
          for (let dy = -2; dy <= 2; dy++) {
            if (dx === 0 && dy === 0) continue;
            const candidate = { x: cell.x + dx, y: cell.y + dy };
            if (cells.some((other, otherIndex) => otherIndex !== index && cellsOverlap(other, candidate))) continue;
            if (!cells.some((other, otherIndex) => otherIndex !== index && hasEdge(other, candidate))) continue;
            const moved = cells.map((entry, entryIndex) => entryIndex === index ? candidate : entry);
            const normalized = normalizeCells(moved);
            if (!isLegalLayout(normalized)) continue;
            next.set(canonical(normalized), normalized);
          }
        }
      }
      return [...next.values()];
    }

    function refineLayoutCandidates(cellsList, maleCount, limit = 18) {
      const pool = new Map();
      cellsList.forEach(cells => pool.set(canonical(cells), cells));
      cellsList.slice(0, Math.min(cellsList.length, 12)).forEach(cells => {
        generateLayoutNeighbors(cells).forEach(next => pool.set(canonical(next), next));
      });
      return [...pool.values()]
        .map(cells => ({ cells, skeleton: scoreLayoutSkeleton(cells, maleCount) }))
        .sort((a, b) => (
          b.skeleton.crossEdges - a.skeleton.crossEdges ||
          b.skeleton.totalEdges - a.skeleton.totalEdges ||
          b.skeleton.degreeSum - a.skeleton.degreeSum ||
          b.skeleton.compactness - a.skeleton.compactness ||
          a.skeleton.height - b.skeleton.height
        ))
        .slice(0, limit)
        .map(entry => entry.cells);
    }

    function compressLayouts(cellsList, maleCount, keep = 36) {
      const ranked = [...new Map(cellsList.map(cells => [canonical(cells), cells])).values()]
        .map(cells => ({
          cells,
          key: canonical(cells),
          skeleton: scoreLayoutSkeleton(cells, maleCount)
        }))
        .sort((a, b) => (
          b.skeleton.crossEdges - a.skeleton.crossEdges ||
          b.skeleton.totalEdges - a.skeleton.totalEdges ||
          b.skeleton.degreeSum - a.skeleton.degreeSum ||
          b.skeleton.compactness - a.skeleton.compactness ||
          a.skeleton.height - b.skeleton.height
        ));

      const picked = [];
      const signatures = new Set();
      for (const entry of ranked) {
        const shape = scoreShape(entry.cells);
        const signature = [
          entry.skeleton.crossEdges,
          entry.skeleton.totalEdges,
          shape.width,
          shape.height,
          entry.cells.slice(0, Math.min(4, entry.cells.length)).map(cell => `${cell.x},${cell.y}`).join("|")
        ].join("__");
        if (signatures.has(signature) && picked.length >= Math.floor(keep * 0.6)) continue;
        signatures.add(signature);
        picked.push(entry.cells);
        if (picked.length >= keep) break;
      }
      return picked;
    }

    async function searchBeamLayouts(n, onProgress) {
      const root = normalizeCells([{ x: 0, y: 0 }]);
      let beam = [{ cells: root, partial: scorePartialLayout(root) }];
      let expanded = 0;
      let attempts = 0;
      let lastYield = performance.now();
      const beamWidth = n <= 10 ? 24 : 18;

      async function maybeYield(force = false) {
        const now = performance.now();
        if (force || now - lastYield > 32) {
          lastYield = now;
          if (onProgress) onProgress({ attempts, expanded, bestPairCount: -1 });
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      for (let size = 1; size < n; size++) {
        const nextMap = new Map();
        const branchLimit = size <= 3 ? 14 : size <= 6 ? 10 : 8;
        for (const state of beam) {
          const candidates = generateCandidatePositions(state.cells).slice(0, branchLimit);
          for (const candidate of candidates) {
            const nextCells = normalizeCells([...state.cells, candidate]);
            const key = canonical(nextCells);
            if (nextMap.has(key)) continue;
            nextMap.set(key, { cells: nextCells, partial: scorePartialLayout(nextCells) });
            expanded++;
          }
        }

        beam = [...nextMap.values()]
          .sort((a, b) => (
            b.partial.pairScore - a.partial.pairScore ||
            b.partial.degreeHead - a.partial.degreeHead ||
            b.partial.compactness - a.partial.compactness ||
            a.partial.height - b.partial.height ||
            a.partial.width - b.partial.width
          ))
          .slice(0, beamWidth);

        attempts += beam.length;
        await maybeYield();
      }

      await maybeYield(true);
      return { layouts: beam.map(entry => entry.cells), attempts, expanded };
    }

    function improveLayout(cells, maleCount, rounds = 6) {
      let current = normalizeCells(cells);
      let currentPlan = evaluatePlan(current, maleCount);
      let currentKey = canonical(current);

      for (let round = 0; round < rounds; round++) {
        const neighbors = generateLayoutNeighbors(current)
          .map(next => ({
            key: canonical(next),
            cells: next,
            skeleton: scoreLayoutSkeleton(next, maleCount)
          }))
          .sort((a, b) => (
            b.skeleton.crossEdges - a.skeleton.crossEdges ||
            b.skeleton.totalEdges - a.skeleton.totalEdges ||
            b.skeleton.degreeSum - a.skeleton.degreeSum ||
            b.skeleton.compactness - a.skeleton.compactness ||
            a.skeleton.height - b.skeleton.height
          ))
          .slice(0, 36);

        let improved = false;
        for (const candidate of neighbors) {
          if (candidate.key === currentKey) continue;
          const plan = evaluatePlan(candidate.cells, maleCount);
          if (comparePlans(plan, currentPlan) < 0) {
            current = candidate.cells;
            currentPlan = plan;
            currentKey = candidate.key;
            improved = true;
            break;
          }
        }

        if (!improved) break;
      }

      return currentPlan;
    }

    async function searchFastPlans(n, maleCount, onProgress) {
      const structured = generateStructuredLayouts(n);
      const beamResult = await searchBeamLayouts(n, onProgress);
      const compressedSeeds = compressLayouts([...structured, ...beamResult.layouts], maleCount, 32);
      const refinedLayouts = refineLayoutCandidates(compressedSeeds, maleCount, 16);
      const planMap = new Map();
      let attempts = beamResult.attempts;
      const expanded = beamResult.expanded;
      let bestPairCount = -1;
      let lastYield = performance.now();

      async function maybeYield(force = false) {
        const now = performance.now();
        if (force || now - lastYield > 32) {
          lastYield = now;
          if (onProgress) onProgress({ attempts, expanded, bestPairCount });
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      for (const cells of refinedLayouts) {
        attempts++;
        const plan = improveLayout(cells, maleCount, 8);
        const key = `${canonical(plan.nests.map(nest => ({ x: nest.x, y: nest.y })))}__${plan.sexMask}`;
        if (!planMap.has(key) || comparePlans(planMap.get(key), plan) > 0) {
          planMap.set(key, plan);
        }
        bestPairCount = Math.max(bestPairCount, plan.score.totalPairs);
        await maybeYield();
      }

      await maybeYield(true);
      return {
        plans: [...planMap.values()].sort(comparePlans).slice(0, 5),
        attempts,
        expanded
      };
    }

    function evaluatePlan(cells, maleCount) {
      if (!isLegalLayout(cells)) {
        throw new Error("生成了非法布局：存在重叠小窝。");
      }
      const sexPlan = evaluateLayout(cells, maleCount);
      const { edges } = sexPlan;
      const nests = cells.map((cell, index) => {
        const isMale = ((sexPlan.maleMask >>> index) & 1) === 1;
        return {
          index,
          x: cell.x,
          y: cell.y,
          centerX: cell.x + 1,
          centerY: cell.y + 1,
          isMale,
          sex: isMale ? "雄性" : "雌性"
        };
      });

      const compatiblePairs = [];
      for (const [a, b] of edges) {
        const left = nests[a];
        const right = nests[b];
        if (left.isMale === right.isMale) continue;
        compatiblePairs.push({
          a,
          b,
          female: left.isMale ? right : left,
          male: left.isMale ? left : right,
          distance: pairDistance(cells[a], cells[b])
        });
      }

      const covered = new Set();
      compatiblePairs.forEach(pair => {
        covered.add(pair.a);
        covered.add(pair.b);
      });

      return {
        nests,
        compatiblePairs,
        score: {
          totalPairs: compatiblePairs.length,
          coveredNests: covered.size,
          deadNests: nests.length - covered.size,
          reachableCrossEdges: sexPlan.crossEdgeUpperBound
        },
        sexMask: sexPlan.maleMask,
        maleCount,
        femaleCount: nests.length - maleCount,
        nestCount: nests.length,
        theoreticalPairs: maleCount * (nests.length - maleCount)
      };
    }

    function comparePlans(a, b) {
      return (
        b.score.totalPairs - a.score.totalPairs ||
        b.score.coveredNests - a.score.coveredNests ||
        a.score.deadNests - b.score.deadNests ||
        b.score.reachableCrossEdges - a.score.reachableCrossEdges
      );
    }

    async function searchExactPlans(n, maleCount, onProgress) {
      if (n <= 0) return { plans: [], attempts: 0, expanded: 0 };

      const seenByDepth = Array.from({ length: n + 1 }, () => new Set());
      const planMap = new Map();
      let attempts = 0;
      let expanded = 0;
      let bestPairCount = -1;
      let lastYield = performance.now();

      function storePlan(plan) {
        const key = `${canonical(plan.nests.map(nest => ({ x: nest.x, y: nest.y })))}__${plan.sexMask}`;
        if (!planMap.has(key) || comparePlans(planMap.get(key), plan) > 0) {
          planMap.set(key, plan);
        }
        if (plan.score.totalPairs > bestPairCount) {
          bestPairCount = plan.score.totalPairs;
        }
      }

      async function maybeYield(force = false) {
        const now = performance.now();
        if (force || now - lastYield > 32) {
          lastYield = now;
          if (onProgress) onProgress({ attempts, expanded, bestPairCount });
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      async function dfs(cells) {
        const size = cells.length;
        if (size === n) {
          attempts++;
          storePlan(evaluatePlan(cells, maleCount));
          await maybeYield();
          return;
        }

        const remaining = n - size;
        const currentScore = scoreShape(cells).pairScore;
        const optimisticUpper = currentScore + remaining * size + (remaining * (remaining - 1)) / 2;
        if (bestPairCount >= 0 && optimisticUpper < bestPairCount) {
          return;
        }

        const nextCandidates = new Map();
        const candidateLimit = size <= 4 ? 18 : 12;
        for (const addition of generateCandidatePositions(cells).slice(0, candidateLimit)) {
          const next = normalizeCells([...cells, addition]);
          const key = canonical(next);
          if (seenByDepth[size + 1].has(key)) continue;
          nextCandidates.set(key, next);
        }

        const ordered = [...nextCandidates.values()]
          .sort((a, b) => (
            scoreShape(b).pairScore - scoreShape(a).pairScore ||
            scoreShape(b).compactness - scoreShape(a).compactness ||
            scoreShape(a).height - scoreShape(b).height
          ));

        for (const next of ordered) {
          const key = canonical(next);
          if (seenByDepth[size + 1].has(key)) continue;
          seenByDepth[size + 1].add(key);
          expanded++;
          await dfs(next);
        }
      }

      const root = normalizeCells([{ x: 0, y: 0 }]);
      seenByDepth[1].add(canonical(root));
      await dfs(root);
      await maybeYield(true);
      return { plans: [...planMap.values()].sort(comparePlans).slice(0, 5), attempts, expanded };
    }

    async function buildPlans(nestCount, maleCount, onProgress) {
      if (nestCount <= 7) {
        return searchExactPlans(nestCount, maleCount, onProgress);
      }
      return searchFastPlans(nestCount, maleCount, onProgress);
    }

    function syncInputs() {
      const autoField = autoFieldInput.value;
      const male = Number(maleInput.value) || 0;
      const female = Number(femaleInput.value) || 0;
      const nest = Number(nestInput.value) || 0;
      if (autoField === "female") {
        femaleInput.value = Math.max(0, nest - male);
      } else if (autoField === "male") {
        maleInput.value = Math.max(0, nest - female);
      } else {
        nestInput.value = Math.max(0, male + female);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        maleCount: maleInput.value,
        femaleCount: femaleInput.value,
        nestCount: nestInput.value,
        autoField: autoFieldInput.value
      }));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        maleInput.value = state.maleCount ?? maleInput.value;
        femaleInput.value = state.femaleCount ?? femaleInput.value;
        nestInput.value = state.nestCount ?? nestInput.value;
        autoFieldInput.value = state.autoField ?? autoFieldInput.value;
      } catch (error) {
        console.error(error);
      }
    }

    function validateInputs() {
      syncInputs();
      const maleCount = Number(maleInput.value);
      const femaleCount = Number(femaleInput.value);
      const nestCount = Number(nestInput.value);
      if (!Number.isInteger(maleCount) || !Number.isInteger(femaleCount) || !Number.isInteger(nestCount)) {
        throw new Error("请输入整数数量。");
      }
      if (maleCount < 0 || femaleCount < 0 || nestCount <= 0) {
        throw new Error("数量不能为负，小窝总数至少为 1。");
      }
      if (maleCount + femaleCount !== nestCount) {
        throw new Error("当前数量必须满足：雄性 + 雌性 = 小窝总数。");
      }
      if (nestCount > 20) {
        throw new Error("为了保证计算速度，当前建议小窝总数不要超过 20。");
      }
      return { maleCount, femaleCount, nestCount };
    }

    function renderOverview(result) {
      overviewGrid.innerHTML = [
        { label: "有效路径数", value: result.compatiblePairs.length },
        { label: "理论上限", value: result.theoreticalPairs },
        { label: "覆盖窝位", value: result.score.coveredNests },
        { label: "空挂窝位", value: result.score.deadNests }
      ].map(item => `<article class="overview"><span>${item.label}</span><strong>${item.value}</strong></article>`).join("");
    }

    function renderStats(result) {
      const items = [
        { label: "公母有效路径", value: result.compatiblePairs.length },
        { label: "理论最大对数", value: result.theoreticalPairs },
        { label: "最优 cut 值", value: result.score.reachableCrossEdges },
        { label: "参与连线窝位", value: result.score.coveredNests },
        { label: "空挂窝位", value: result.score.deadNests }
      ];
      statsEl.innerHTML = items.map(item => `<article class="stat"><span>${item.label}</span><strong>${item.value}</strong></article>`).join("");
    }

    function renderBoard(result) {
      const margin = 46;
      const unit = 56;
      const nestSize = unit * 2;
      const maxCellX = Math.max(...result.nests.map(nest => nest.x)) + 2;
      const maxCellY = Math.max(...result.nests.map(nest => nest.y)) + 2;
      const width = maxCellX * unit + margin * 2;
      const height = maxCellY * unit + margin * 2;

      const lines = result.compatiblePairs.map(pair => {
        const from = result.nests[pair.a];
        const to = result.nests[pair.b];
        return `<line x1="${margin + from.centerX * unit}" y1="${margin + from.centerY * unit}" x2="${margin + to.centerX * unit}" y2="${margin + to.centerY * unit}" stroke="${getComputedStyle(document.documentElement).getPropertyValue("--pair").trim()}" stroke-width="10" stroke-linecap="round" />`;
      }).join("");

      const tiles = result.nests.map(nest => {
        const x = margin + nest.x * unit;
        const y = margin + nest.y * unit;
        const degree = result.compatiblePairs.filter(pair => pair.a === nest.index || pair.b === nest.index).length;
        const fill = nest.isMale ? "rgba(111, 181, 198, 0.92)" : "rgba(239, 148, 134, 0.92)";
        return `<g>
          <rect x="${x}" y="${y}" width="${nestSize}" height="${nestSize}" rx="20" ry="20" fill="${fill}" stroke="rgba(32,51,61,0.18)" stroke-width="2" />
          <text x="${x + 16}" y="${y + 34}" font-size="14" font-weight="700" fill="#fff">${nest.sex}</text>
          <text x="${x + 16}" y="${y + 62}" font-size="14" font-weight="700" fill="#fff">(${nest.x}, ${nest.y})</text>
          <text x="${x + 16}" y="${y + 92}" font-size="12" fill="rgba(255,255,255,0.92)">可连路径 ${degree}</text>
        </g>`;
      }).join("");

      const gridLines = [];
      for (let x = 0; x <= maxCellX; x++) {
        const px = margin + x * unit;
        gridLines.push(`<line x1="${px}" y1="${margin}" x2="${px}" y2="${height - margin}" stroke="rgba(32,51,61,0.08)" stroke-width="1" />`);
      }
      for (let y = 0; y <= maxCellY; y++) {
        const py = margin + y * unit;
        gridLines.push(`<line x1="${margin}" y1="${py}" x2="${width - margin}" y2="${py}" stroke="rgba(32,51,61,0.08)" stroke-width="1" />`);
      }

      boardEl.setAttribute("viewBox", `0 0 ${width} ${height}`);
      boardEl.innerHTML = `<g>${gridLines.join("")}</g><g>${lines}</g><g>${tiles}</g>`;
    }

    function renderTable(result) {
      nestTableBody.innerHTML = result.nests.map(nest => {
        const degree = result.compatiblePairs.filter(pair => pair.a === nest.index || pair.b === nest.index).length;
        return `<tr><td>${nest.index + 1}</td><td><span class="badge ${nest.isMale ? "male" : "female"}">${nest.sex}</span></td><td>(${nest.x}, ${nest.y})</td><td>${degree}</td></tr>`;
      }).join("");
    }

    function renderPairs(result) {
      if (result.compatiblePairs.length === 0) {
        pairList.innerHTML = `<div class="pair-chip">当前组合下没有任何有效公母路径。</div>`;
        return;
      }
      pairList.innerHTML = result.compatiblePairs.map((pair, index) => `
        <div class="pair-chip">
          <strong>路径 ${index + 1}</strong><br>
          公窝：#${pair.male.index + 1} (${pair.male.x}, ${pair.male.y})<br>
          母窝：#${pair.female.index + 1} (${pair.female.x}, ${pair.female.y})<br>
          中心曼哈顿距离：${pair.distance}
        </div>
      `).join("");
    }

    function renderSolutionOptions(plans) {
      solutionSelectEl.innerHTML = plans.map((plan, index) => `<option value="${index}">方案 ${index + 1}：${plan.compatiblePairs.length} 条路径</option>`).join("");
      solutionNoteEl.textContent = plans.length > 1
        ? "这里保留几组高分摆法。第一组默认展示，后面几组通常是同分或接近同分的替代摆法。"
        : "当前只找到一组最强摆法。";
    }

    function renderPlan(result) {
      renderOverview(result);
      renderStats(result);
      renderBoard(result);
      renderTable(result);
      renderPairs(result);
    }

    async function runPlanner() {
      try {
        const { maleCount, femaleCount, nestCount } = validateInputs();
        saveState();
        statusEl.className = "status good";
        statusEl.textContent = nestCount <= 10 ? "正在搜索，请稍等。" : "正在计算高分摆法，请稍等。";

        const result = await buildPlans(nestCount, maleCount, progress => {
          const bestText = progress.bestPairCount >= 0 ? progress.bestPairCount : "-";
          statusEl.textContent = nestCount <= 10
            ? `正在搜索：已尝试 ${progress.attempts} 种完整摆法，已扩展 ${progress.expanded} 个中间状态，当前最好 ${bestText} 条路径。`
            : `正在计算：已尝试 ${progress.attempts} 种候选，当前最好 ${bestText} 条路径。`;
        });

        const plans = result.plans;
        if (!plans || plans.length === 0) throw new Error("没有找到可用摆法。");

        currentPlans = plans;
        renderSolutionOptions(plans);
        solutionSelectEl.value = "0";
        renderPlan(plans[0]);
        statusEl.textContent = `已完成：${maleCount} 公 / ${femaleCount} 母 / ${nestCount} 窝，尝试了 ${result.attempts} 种摆法，当前最佳得到 ${plans[0].compatiblePairs.length} 条有效路径。`;
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = error.message;
        overviewGrid.innerHTML = "";
        statsEl.innerHTML = "";
        boardEl.innerHTML = "";
        nestTableBody.innerHTML = "";
        pairList.innerHTML = "";
        solutionSelectEl.innerHTML = "";
        solutionNoteEl.textContent = "";
      }
    }

    maleInput.addEventListener("input", syncInputs);
    femaleInput.addEventListener("input", syncInputs);
    nestInput.addEventListener("input", syncInputs);
    autoFieldInput.addEventListener("change", syncInputs);
    solveButton.addEventListener("click", () => { void runPlanner(); });
    presetButton.addEventListener("click", () => {
      maleInput.value = 5;
      femaleInput.value = 5;
      nestInput.value = 10;
      autoFieldInput.value = "nest";
      syncInputs();
    });
    solutionSelectEl.addEventListener("change", event => {
      const index = Number(event.target.value);
      if (Number.isInteger(index) && currentPlans[index]) {
        renderPlan(currentPlans[index]);
      }
    });

    loadState();
    syncInputs();
  </script>
</body>
</html>
